name: Rule Resolver CI

on:
  push:
    branches:
      - prototype/r9-rule-resolver
    paths:
      - src/conformance/**
      - test/conformance/**
      - test/fixtures/**
      - package.json
      - .github/workflows/rule-resolver.yml
  pull_request:
    paths:
      - src/conformance/**
      - test/conformance/**
      - test/fixtures/**
      - package.json
      - .github/workflows/rule-resolver.yml

permissions:
  contents: read

concurrency:
  group: rule-resolver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.20.0
          - 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Record runtime
        run: node --version

      - name: Run contract and real-project fixture tests
        run: npm test
